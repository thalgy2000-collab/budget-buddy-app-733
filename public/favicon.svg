<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2" />
  
  <!-- Subtle inner circle accent -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="3 3" />

  <!-- Dollar sign glyph -->
  <!-- Vertical spine lines -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- S shape -->
  <path d="M41 22.5 C41 17.5 37 17.5 32 17.5 C26 17.5 22.5 19.5 22.5 24.5 C22.5 30 30.5 30.8 33.5 32 C38 33.8 41.5 35.5 41.5 40.5 C41.5 45.8 37 46.5 32 46.5 C26 46.5 22 44 22 39.5" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>
